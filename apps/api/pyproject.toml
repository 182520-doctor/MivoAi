[project]
name = "ai-dev-api"
version = "0.1.0"
description = "Layered FastAPI gateway for the local Codex App Server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45.0.0",
    "fastapi[standard]>=0.116.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "ruff>=0.12.0",
    "pytest>=8.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
